name: QA CI/CD Pipeline (Docker, Newman & Playwright)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-tests:
    name: Run API & E2E Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 🐳 Start Docker Compose Stack (Postgres + Express + React)
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          sleep 12
          curl -f http://localhost:5000/health || exit 1
          curl -f http://localhost:5173 || exit 1

      - name: 📦 Install Test Dependencies
        working-directory: automation-tests
        run: npm install

      - name: 🚀 Run Newman API Tests (Postman Collection)
        working-directory: automation-tests
        run: npm run test:api

      - name: 🧹 Reset QA Chaos & Re-seed Database
        run: curl -s -X POST http://localhost:5000/api/v1/qa/reset

      - name: 🎭 Install Playwright Browsers
        working-directory: automation-tests
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Playwright E2E UI Tests
        working-directory: automation-tests
        run: npm run test:e2e

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: automation-tests/playwright-report/
          retention-days: 14

      - name: 🛑 Stop Docker Containers
        if: always()
        run: docker compose down -v
